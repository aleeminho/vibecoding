# Deploys DUO's Edge Function to Supabase when its source changes.
#
# This is a SEPARATE pipeline from the two site deploys, and conflating the two
# is the mistake this workflow exists to prevent.
#
#   src/, index.html, public/   -> built by vite    -> Jagoan + GitHub Pages
#   supabase/functions/**       -> deployed by CLI  -> Supabase
#
# The function is not part of the frontend build. A change to prompt.ts does not
# alter dist/ by a single byte, so the site workflows run, find nothing to
# upload, report success — and the application behaves exactly as before. That
# happened once already: a prompt fix was pushed, everything went green, and the
# warning it was meant to remove was still on screen. The change only took
# effect because the function was deployed by hand.
#
# One repository secret is required:
#
#   SUPABASE_ACCESS_TOKEN   dashboard -> Account -> Access Tokens
#
# That is an ACCOUNT token for the CLI, not a project key. Do not confuse it
# with the publishable key, which is public and lives in repository variables.

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    # Only when the function itself changes. Running this on every push would
    # redeploy identical code and add noise to the history for nothing.
    paths:
      - 'DUO/supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the access token
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice title=Skipping function deploy::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.creds.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - if: steps.creds.outputs.skip != 'true'
        name: Deploy functions
        working-directory: DUO
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # The project ref is not a secret — it is the subdomain of the URL
          # that ships inside the public JavaScript bundle — so it is written
          # out rather than stored, which keeps this to one thing to configure.

          # Gateway verification stays ON. isSignedIn() here reads the JWT
          # payload without checking its signature, which is only sound because
          # the gateway checked it first.
          supabase functions deploy extract-receipt \
            --project-ref xkjtzthsqorqyyqkbrzb

          # Verification is OFF, deliberately and for this function alone.
          # Its callers are the people the operator split a bill with: they have
          # no account and will not make one to upload a screenshot. There is
          # therefore no JWT to verify, and the security model is the payment
          # token in the URL instead — see the note at the top of its index.ts,
          # which is also why it accepts only a token and an image.
          supabase functions deploy validate-payment --no-verify-jwt \
            --project-ref xkjtzthsqorqyyqkbrzb

      - if: steps.creds.outputs.skip != 'true'
        name: Confirm verify_jwt is set per function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Asserted per function, not for all of them together.
          #
          # An earlier version of this step demanded verify_jwt be true
          # everywhere, and a public function has to be the exception — so a
          # blanket rule would either block the legitimate case or be loosened
          # until it checked nothing. Naming each function and the value it must
          # have means flipping either one is caught rather than tolerated.
          curl -s "https://api.supabase.com/v1/projects/xkjtzthsqorqyyqkbrzb/functions" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | tr -d '\n' > /tmp/fns.json

          # The newlines are stripped because grep matches line by line, and
          # pretty-printed JSON puts "slug" and "verify_jwt" on different lines —
          # so a pattern spanning them matches nothing and the guard reports
          # every function as broken. That is exactly what the first version of
          # this step did.
          fail=0
          expect() {
            actual=$(grep -o "\"slug\": *\"$1\"[^}]*\"verify_jwt\": *[a-z]*" /tmp/fns.json \
                     | grep -o '[a-z]*$')
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 has verify_jwt='$actual', expected '$2'."
              fail=1
            else
              echo "$1: verify_jwt=$actual (correct)"
            fi
          }

          # extract-receipt trusts the gateway, so it must keep verification on.
          expect extract-receipt true
          # validate-payment is called by people with no account, so it must not.
          expect validate-payment false

          exit $fail
